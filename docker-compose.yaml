services:
  beamup:
    build:
      context: .
    ports:
      - 3000:3000
    environment:
      - DATABASE_URL=postgres://beamup:beamup@postgres:5432/beamup
      - ALLOWED_ORIGINS=http://localhost:5173
      - PROD=true
      - SMTP_HOST=smtp
      - SMTP_PORT=1025
      - S3_BUCKET=beamup
      - S3_ENDPOINT=http://s3:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - postgres
    develop:
      watch:
        - path: src/
          target: /app/src/
          action: sync+restart
        - path: drizzle/
          target: /app/drizzle/
          action: sync+restart

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=beamup
      - POSTGRES_PASSWORD=beamup
      - POSTGRES_DB=beamup
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  smtp:
    # image: namshi/smtp
    # ports:
    #   - 1025:25
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

  s3:
    image: minio/minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

volumes:
  postgres-data:
