name: Docker image

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to push
        required: true

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Get some info for OpenContainer values from Github API
        id: meta
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "description=$(gh api repos/${{github.repository}} --jq .description)" >> $GITHUB_OUTPUT
          echo "version=$(gh api repos/${{github.repository}}/tags --jq '.[0].name' | sed s/v//)" >> $GITHUB_OUTPUT
          echo "now=$(date --utc --iso-8601=seconds)" >> $GITHUB_OUTPUT
      - name: Build docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag || github.ref_name }}
          file: ./Dockerfile
          build-args: |
            description=${{ steps.meta.outputs.description }}
            created_at=${{ steps.meta.outputs.now }}
            revision=${{ github.sha }}
            repository=https://github.com/${{ github.repository }}
            version=${{ steps.meta.outputs.version }}
      - name: Deploy new version on production
        env:
          SA: ${{ secrets.HYPERFLUID_SERVICE_ACCOUNT }}
          ENV: Default
          APP: cigale-beamup
        run: |
          echo "$SA" > sa.json
          curl -fsSL https://ai.meso.umontpellier.fr/downloads/install.sh | sh
          hfctl auth login --service-account sa.json
          hfctl config set env "$ENV"
          hfctl apps restart "$APP"
